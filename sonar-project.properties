sonar.projectKey=nf-extractor
sonar.projectName=nf-extractor
sonar.sourceEncoding=UTF-8

sonar.sources=src,eval
sonar.tests=src,eval,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,eval/**/*.test.ts,e2e/**/*.spec.ts
sonar.exclusions=src/nf/application/testes/**,eval/gabarito.json,eval/resultados/**

# Mesmo critério do vitest.config.mts. O que fica de fora é coberto pelo e2e (telas, rotas,
# APIs do navegador) ou é ligação de infraestrutura e script que fala com API paga/navegador.
sonar.coverage.exclusions=src/app/**,src/nf/infra/schema.ts,src/instrumentation.ts,src/nf/infra/db.ts,src/nf/infra/container.ts,src/nf/infra/logger.ts,src/ui/envio.tsx,src/ui/visualizador.tsx,src/ui/previews.ts,src/ui/reduzir-imagem.ts,src/ui/icones.tsx,src/ui/barra-lateral.tsx,src/ui/pilula.tsx,eval/gerar.ts,eval/rodar.ts,eval/templates.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
